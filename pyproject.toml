[project]
name = "over40lift"
version = "0.1.0"
description = "Injury/soreness-aware, equipment-aware lifting recommendation engine for lifters 40+"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["over40lift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
